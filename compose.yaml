name: orderflow

services:
  accumulator-db:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: accumulator
      POSTGRES_USER: ${ORDERFLOW_DB_USER:-orderflow}
      POSTGRES_PASSWORD: ${ACCUMULATOR_DB_PASSWORD:-orderflow-local}
    ports:
      - "127.0.0.1:${ACCUMULATOR_DB_PORT:-15432}:5432"
    volumes:
      - accumulator-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${ORDERFLOW_DB_USER:-orderflow} -d accumulator"]
      interval: 2s
      timeout: 3s
      retries: 30
  generator-db:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: generator
      POSTGRES_USER: ${ORDERFLOW_DB_USER:-orderflow}
      POSTGRES_PASSWORD: ${GENERATOR_DB_PASSWORD:-orderflow-local}
    ports:
      - "127.0.0.1:${GENERATOR_DB_PORT:-15433}:5432"
    volumes:
      - generator-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${ORDERFLOW_DB_USER:-orderflow} -d generator"]
      interval: 2s
      timeout: 3s
      retries: 30
  accumulator:
    build:
      context: .
      target: accumulator
    environment:
      Fix__Port: 5001
      Fix__AcceptHost: 0.0.0.0
      Storage__Directory: /data
      ConnectionStrings__Orders: Host=accumulator-db;Database=accumulator;Username=${ORDERFLOW_DB_USER:-orderflow};Password=${ACCUMULATOR_DB_PASSWORD:-orderflow-local}
    depends_on:
      accumulator-db:
        condition: service_healthy
    volumes:
      - accumulator-data:/data
    restart: "no"
  generator:
    build:
      context: .
      target: generator
    environment:
      Fix__Host: accumulator
      Fix__Port: 5001
      Storage__Directory: /data
      ConnectionStrings__Orders: Host=generator-db;Database=generator;Username=${ORDERFLOW_DB_USER:-orderflow};Password=${GENERATOR_DB_PASSWORD:-orderflow-local}
    volumes:
      - generator-data:/data
    ports:
      - "127.0.0.1:${ORDERFLOW_HTTP_PORT:-5000}:8080"
    depends_on:
      generator-db:
        condition: service_healthy
      accumulator:
        condition: service_started
    restart: "no"

volumes:
  accumulator-postgres:
    name: ${ORDERFLOW_DATA_ID:-orderflow}-accumulator-postgres
  generator-postgres:
    name: ${ORDERFLOW_DATA_ID:-orderflow}-generator-postgres
  accumulator-data:
    name: ${ORDERFLOW_DATA_ID:-orderflow}-accumulator-data
  generator-data:
    name: ${ORDERFLOW_DATA_ID:-orderflow}-generator-data
