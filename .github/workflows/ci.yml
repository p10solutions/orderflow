name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: mkdir -p docs/evidence
      - run: npm audit --prefix web --audit-level=high --json > docs/evidence/npm-audit.json
      - run: dotnet restore OrderFlow.slnx --locked-mode
      - run: dotnet build OrderFlow.slnx -c Release --no-restore
      - run: node scripts/with-postgres.mjs dotnet test OrderFlow.slnx -c Release --no-build --logger trx
      - run: node scripts/with-postgres.mjs node scripts/verify-recovery.mjs
      - run: node --test scripts/tests/*.test.mjs
      - run: dotnet list OrderFlow.slnx package --vulnerable --include-transitive --format json > docs/evidence/nuget-audit.json
      - run: dotnet publish src/OrderGenerator.Host -c Release --no-build --no-restore -o .tools/publish/OrderGenerator
      - run: dotnet publish src/OrderAccumulator.Host -c Release --no-build --no-restore -o .tools/publish/OrderAccumulator
      - run: npx --prefix web playwright install --with-deps chromium
      - run: node scripts/with-postgres.mjs node scripts/verify-local.mjs --published
        env:
          BROWSER_CHANNEL: chromium
      - run: node scripts/with-postgres.mjs node scripts/verify-local.mjs --load-only
      - run: docker compose -p orderflow-verification build
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: orderflow-verification-generator
          version: v0.76.2
          format: json
          output: docs/evidence/image-audit-generator.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: orderflow-verification-accumulator
          version: v0.76.2
          format: json
          output: docs/evidence/image-audit-accumulator.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - run: node scripts/verify-compose.mjs
        env:
          BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: operational-evidence
          path: |
            docs/evidence/implementation-*
            docs/evidence/performance.json
            docs/evidence/npm-audit.json
            docs/evidence/nuget-audit.json
            docs/evidence/image-audit-*.json
            .tools/verification/*.log

